apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-agent-matrix.fullname" . }}
  labels:
    {{- include "ai-agent-matrix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-agent-matrix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-agent-matrix.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: matrix-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-agent-matrix.fullname" . }}-config
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if .Values.secret.enabled }}
            - name: config
              mountPath: /app/config/local.env
              subPath: local.env
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | default "/api/health" }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | default "/api/health/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ai-agent-matrix.fullname" . }}-data
        {{- end }}
        {{- if .Values.secret.enabled }}
        - name: config
          secret:
            secretName: {{ .Values.secret.name }}
            optional: true
        {{- end }}
