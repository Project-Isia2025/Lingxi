apiVersion: v1
kind: Service
metadata:
  name: ai-agent-matrix
  labels:
    app: ai-agent-matrix
spec:
  type: NodePort
  selector:
    app: ai-agent-matrix
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      nodePort: 30200

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-agent-matrix-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
