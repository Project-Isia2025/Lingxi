[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-commerce-agent"
version = "1.0.0"
description = "多智能体内容电商系统 — Orchestrator + 四子 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "playwright>=1.40",
    "edge-tts>=6.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "celery>=5.3",
    "qdrant-client>=1.7",
    "langchain-openai>=0.1",
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.27",
    "ffmpeg-python>=0.2",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "structlog>=24.1",
    "minio>=7.2",
    "prometheus-client>=0.20",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "memory*", "infra*", "orchestrator*", "api*", "core*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
