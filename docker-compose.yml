version: "3.9"

services:
  # ---- 应用服务 ----
  matrix-api:
    build: .
    container_name: ai-agent-matrix
    ports:
      - "9200:9200"
    volumes:
      - ./data:/app/data
      - ./config/local.env:/app/config/local.env:ro
    environment:
      - API_PORT=9200
      - REVIEW_BASE_URL=http://127.0.0.1:9200
      - DATABASE_URL=postgresql+asyncpg://agent:${DB_PASSWORD:-changeme}@postgres:5432/commerce_agent
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_BACKEND=celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_USER=${MINIO_USER:-minioadmin}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9200/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 业务主库为 SQLite（./data/matrix_agent.db）；Postgres 仅 Phase0 记忆/Campaign 可选组件

  matrix-playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: ai-agent-matrix-playwright
    profiles: ["playwright", "full"]
    ports:
      - "9201:9200"
    volumes:
      - ./data:/app/data
      - ./config/local.env:/app/config/local.env:ro
    environment:
      - API_PORT=9200
      - REVIEW_BASE_URL=http://127.0.0.1:9201
      - PUBLISH_QUEUE_ENABLED=1
      - PUBLISH_QUEUE_INTERVAL_SEC=300
    restart: unless-stopped
    depends_on:
      matrix-api:
        condition: service_started

  matrix-tunnel:
    image: cloudflare/cloudflared:2024.8.3
    container_name: ai-agent-matrix-tunnel
    profiles: ["tunnel", "full"]
    command: tunnel --no-autoupdate --url http://matrix-api:9200
    depends_on:
      matrix-api:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build: .
    container_name: commerce-agent-celery
    command: celery -A infra.task_queue.celery_app worker --loglevel=info
    volumes:
      - ./data:/app/data
      - ./config/local.env:/app/config/local.env:ro
    environment:
      - WORKER_BACKEND=celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: commerce-agent-celery-beat
    command: celery -A infra.task_queue.celery_app beat --loglevel=info
    volumes:
      - ./data:/app/data
      - ./config/local.env:/app/config/local.env:ro
    environment:
      - WORKER_BACKEND=celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # ---- 数据库 ----
  # Postgres：可选，供 Phase0 向量记忆 / Campaign API；核心业务队列与审核走 SQLite
  postgres:
    profiles: ["infra", "full", "campaign"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d commerce_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 向量数据库 ----
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- 对象存储 ----
  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- 监控 ----
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

  # ---- Phase 7 Campaign API（指南规范，端口 8000）----
  campaign-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: commerce-agent-campaign-api
    profiles: ["campaign", "full"]
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./config/local.env:/app/config/local.env:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://agent:${DB_PASSWORD:-changeme}@postgres:5432/commerce_agent
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
  qdrant_data:
  minio_data:
